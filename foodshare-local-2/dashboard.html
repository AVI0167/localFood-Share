<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | FoodShare Local</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <header class="navbar">

        <div class="logo">
            Food<span>Share</span>
        </div>


        <button id="logoutButton" class="nav-button">

            Logout

        </button>

    </header>



    <main class="dashboard-page">


        <div class="dashboard-container">


            <div class="dashboard-header">

                <span>
                    YOUR DASHBOARD
                </span>

                <h1 id="welcomeText">
                    Welcome
                </h1>

                <p>
                    Manage your FoodShare Local account.
                </p>

            </div>



            <div class="profile-card">


                <div class="profile-avatar">
                    FS
                </div>


                <div>

                    <h2 id="userName">
                        Loading...
                    </h2>

                    <p id="userEmail">
                        Loading...
                    </p>

                </div>


            </div>



            <div class="role-card">


                <span>
                    ACCOUNT ROLE
                </span>


                <h2 id="userRole">
                    Loading...
                </h2>


                <p id="roleDescription">
                    Loading...
                </p>


            </div>


        </div>


    </main>


    <script type="module" src="js/dashboard.js">
    </script>


</body>

</html>
